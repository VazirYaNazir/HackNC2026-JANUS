name: JANUS tests
on: [push, pull_request]
jobs:
  integration:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: npm ci
      - run: uv sync --locked --directory agent
      - run: uv sync --locked --directory backend
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-traces
          path: frontend/test-results
  isolated-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --directory agent
      - name: Prepare and probe the shipped worker
        run: uv run --locked --directory agent python -m agent.main worker prepare
      - name: Check actual kernel containment and complete worker cleanup
        env:
          JANUS_TEST_CONTAINER: '1'
        run: uv run --locked --directory agent python -m unittest tests.test_container_integration -v
  native-sdk:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - run: uv sync --locked --directory agent
      - run: uv run --locked --directory agent python -m unittest tests.test_agent
      - run: uv run --locked --directory agent python -m agent.main build
