[project]
name = "agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "google>=3.0.0",
    "numpy>=2.5.3",
    "pynput>=1.8.2",
    "python-dotenv>=1.2.4",
    "websockets>=17.2",
]

[dependency-groups]
dev = [
    "coverage>=7.6,<8",
]

[tool.coverage.run]
branch = true
source = ["agent"]
concurrency = ["thread"]

[tool.coverage.report]
show_missing = true
precision = 2
fail_under = 99
