
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: hacknc-backend

    ports:
      - "8000:8000"

    env_file:
      - ./backend/.env

    environment:
      PYTHONUNBUFFERED: "1"
      WATCHFILES_FORCE_POLLING: "true"

    volumes:
      - ./backend:/app

    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
